[package]
name = "rz0-module-protocol"
version = "0.1.0"
edition = "2024"
authors = ["Travis J. Neuman <travis@neuman.dev>"]
description = "Fixture-only process invocation protocol contract for runtime.zero modules"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[features]
default = []
protocol-test-child = ["dep:libc", "dep:serde_json"]

[dependencies]
libc = { version = "0.2", optional = true }
rz0-capability-contract = { version = "0.1.0", path = "../capability-contract" }
rz0-error-contract = { version = "0.1.0", path = "../error-contract" }
rz0-resource-contract = { version = "0.1.0", path = "../resource-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
rz0-artifact-identity = { version = "0.1.0", path = "../artifact-identity" }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[[bin]]
name = "rz0-protocol-test-child"
path = "tests/support/protocol_test_child.rs"
required-features = ["protocol-test-child"]
test = false
bench = false
