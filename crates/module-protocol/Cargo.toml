[package]
name = "rz0-module-protocol"
version = "0.1.0"
edition = "2024"
authors = ["Travis J. Neuman <travis@neuman.dev>"]
description = "Fixture-only process invocation protocol contract for runtime.zero modules"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[features]
default = []
protocol-test-child = ["dep:libc", "dep:serde_json"]

[dependencies]
libc = { version = "0.2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"

[[bin]]
name = "rz0-protocol-test-child"
path = "tests/support/protocol_test_child.rs"
required-features = ["protocol-test-child"]
test = false
bench = false
