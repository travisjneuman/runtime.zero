[package]
name = "rz0-artifact-identity"
version = "0.1.0"
edition = "2024"
authors = ["Travis J. Neuman <travis@neuman.dev>"]
description = "Opened-file artifact identity and digest primitives for runtime.zero"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[dependencies]
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
