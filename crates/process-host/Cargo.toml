[package]
name = "rz0-process-host"
version = "0.1.0"
edition = "2024"
authors = ["Travis J. Neuman <travis@neuman.dev>"]
description = "Bounded process I/O and platform containment primitives for runtime.zero"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[features]
default = []
test-support = []

[dependencies]
rz0-artifact-identity = { version = "0.1.0", path = "../artifact-identity" }
rz0-cancellation-contract = { version = "0.1.0", path = "../cancellation-contract" }
rz0-error-contract = { version = "0.1.0", path = "../error-contract" }
rz0-resource-contract = { version = "0.1.0", path = "../resource-contract" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
