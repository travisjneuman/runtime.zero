[package]
name = "rz0-module-trust"
version = "0.1.0"
edition = "2024"
authors = ["Travis J. Neuman <travis@neuman.dev>"]
description = "Test-key-only detached module signature contract for runtime.zero"
license = "Apache-2.0"
publish = false
rust-version = "1.96"

[dependencies]
ed25519-dalek = { version = "3.0", default-features = false }
rz0-resource-contract = { version = "0.1.0", path = "../resource-contract" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"
