[package]
name = "rz0-quarantine"
version = "0.1.0"
edition = "2024"
authors = ["Travis J. Neuman <travis@neuman.dev>"]
description = "Receipt-bound quarantine and restore execution for runtime.zero"
license = "Apache-2.0"
repository = "https://github.com/travisjneuman/runtime.zero"
publish = false
rust-version = "1.96"

[dependencies]
rz0-action-plan = { version = "0.1.0", path = "../action-plan" }
rz0-confirmation-contract = { version = "0.1.0", path = "../confirmation-contract" }
rz0-error-contract = { version = "0.1.0", path = "../error-contract" }
rz0-resource-contract = { version = "0.1.0", path = "../resource-contract" }
rz0-secure-fs = { version = "0.1.0", path = "../secure-fs" }
rz0-transaction-contract = { version = "0.1.0", path = "../transaction-contract" }
rz0-validation-contract = { version = "0.1.0", path = "../validation-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
