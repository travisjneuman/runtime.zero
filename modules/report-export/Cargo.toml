[package]
name = "rz0-module-report-export"
version = "0.1.0"
edition = "2024"
authors = ["Travis J. Neuman <travis@neuman.dev>"]
description = "Privacy-reviewed report and support export module for runtime.zero"
license = "Apache-2.0"
repository = "https://github.com/travisjneuman/runtime.zero"
rust-version = "1.96"
publish = false

[dependencies]
rz0-diagnostics-contract = { version = "0.1.0", path = "../../crates/diagnostics-contract" }
rz0-inventory-contract = { version = "0.1.0", path = "../../crates/inventory-contract" }
rz0-resource-contract = { version = "0.1.0", path = "../../crates/resource-contract" }
rz0-support-contract = { version = "0.1.0", path = "../../crates/support-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "rz0-report-export"
path = "src/main.rs"
