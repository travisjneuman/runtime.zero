[package]
name = "rz0-module-updater"
version = "0.1.0"
edition = "2024"
authors = ["Travis J. Neuman <travis@neuman.dev>"]
description = "Installed-only update finding classifier for runtime.zero"
license = "Apache-2.0"
repository = "https://github.com/travisjneuman/runtime.zero"
rust-version = "1.96"
publish = false

[dependencies]
quick-xml = "0.41"
rz0-action-plan = { version = "0.1.0", path = "../../crates/action-plan" }
rz0-capability-contract = { version = "0.1.0", path = "../../crates/capability-contract" }
rz0-finding-contract = { version = "0.1.0", path = "../../crates/finding-contract" }
rz0-resource-contract = { version = "0.1.0", path = "../../crates/resource-contract" }
rz0-validation-contract = { version = "0.1.0", path = "../../crates/validation-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "rz0-updater"
path = "src/main.rs"
