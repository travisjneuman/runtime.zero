[package]
name = "rz0-module-inventory"
version = "0.1.0"
edition = "2024"
authors = ["Travis J. Neuman <travis@neuman.dev>"]
description = "Read-only first-party inventory module for runtime.zero"
license = "Apache-2.0"
repository = "https://github.com/travisjneuman/runtime.zero"
rust-version = "1.96"
publish = false

[dependencies]
rz0-cancellation-contract = { version = "0.1.0", path = "../../crates/cancellation-contract" }
rz0-inventory-contract = { version = "0.1.0", path = "../../crates/inventory-contract" }
rz0-privacy-contract = { version = "0.1.0", path = "../../crates/privacy-contract" }
rz0-process-host = { version = "0.1.0", path = "../../crates/process-host" }
rz0-resource-contract = { version = "0.1.0", path = "../../crates/resource-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[[bin]]
name = "rz0-inventory"
path = "src/main.rs"
