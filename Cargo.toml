[package]
name = "runtime-zero"
version = "0.1.0"
edition = "2024"
authors = ["Travis J. Neuman <travis@neuman.dev>"]
description = "runtime.zero — System Management Toolkit"
license = "Apache-2.0"
repository = "https://github.com/travisjneuman/runtime.zero"
homepage = "https://rz0.neuman.dev"
readme = "README.md"
keywords = ["cli", "system", "maintenance", "scanner", "toolkit"]
categories = ["command-line-utilities"]
rust-version = "1.96"

[workspace]
resolver = "3"
members = [
    "crates/action-plan",
    "crates/artifact-identity",
    "crates/capability-contract",
    "crates/cancellation-contract",
    "crates/confirmation-contract",
    "crates/configuration-contract",
    "crates/diagnostics-contract",
    "crates/error-contract",
    "crates/finding-contract",
    "crates/inventory-contract",
    "crates/module-lifecycle",
    "crates/module-protocol",
    "crates/module-trust",
    "crates/performance-contract",
    "crates/privacy-contract",
    "crates/process-host",
    "crates/quarantine",
    "crates/release-contract",
    "crates/registry-contract",
    "crates/resource-contract",
    "crates/secure-fs",
    "crates/support-contract",
    "crates/transaction-contract",
    "crates/validation-contract",
    "modules/cache",
    "modules/inventory",
    "modules/leftovers",
    "modules/report-export",
    "modules/security-integrity",
    "modules/uninstall",
    "modules/updater",
]

[dependencies]
libc = "0.2"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
rz0-action-plan = { version = "0.1.0", path = "crates/action-plan" }
rz0-artifact-identity = { version = "0.1.0", path = "crates/artifact-identity" }
rz0-cancellation-contract = { version = "0.1.0", path = "crates/cancellation-contract" }
rz0-capability-contract = { version = "0.1.0", path = "crates/capability-contract" }
rz0-confirmation-contract = { version = "0.1.0", path = "crates/confirmation-contract" }
rz0-diagnostics-contract = { version = "0.1.0", path = "crates/diagnostics-contract" }
rz0-finding-contract = { version = "0.1.0", path = "crates/finding-contract" }
rz0-inventory-contract = { version = "0.1.0", path = "crates/inventory-contract" }
rz0-module-lifecycle = { version = "0.1.0", path = "crates/module-lifecycle" }
rz0-module-trust = { version = "0.1.0", path = "crates/module-trust" }
rz0-module-inventory = { version = "0.1.0", path = "modules/inventory" }
rz0-module-cache = { version = "0.1.0", path = "modules/cache" }
rz0-module-leftovers = { version = "0.1.0", path = "modules/leftovers" }
rz0-module-security-integrity = { version = "0.1.0", path = "modules/security-integrity" }
rz0-module-uninstall = { version = "0.1.0", path = "modules/uninstall" }
rz0-module-updater = { version = "0.1.0", path = "modules/updater" }
rz0-process-host = { version = "0.1.0", path = "crates/process-host" }
rz0-quarantine = { version = "0.1.0", path = "crates/quarantine" }
rz0-registry-contract = { version = "0.1.0", path = "crates/registry-contract" }
rz0-release-contract = { version = "0.1.0", path = "crates/release-contract" }
rz0-resource-contract = { version = "0.1.0", path = "crates/resource-contract" }
rz0-secure-fs = { version = "0.1.0", path = "crates/secure-fs" }
rz0-support-contract = { version = "0.1.0", path = "crates/support-contract" }
rz0-transaction-contract = { version = "0.1.0", path = "crates/transaction-contract" }
rz0-validation-contract = { version = "0.1.0", path = "crates/validation-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
signal-hook = "0.3"
plist = { version = "1.10", default-features = false }

[[bin]]
name = "rz0"
path = "src/main.rs"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
